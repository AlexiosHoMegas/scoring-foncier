# Configuration du scoring foncier.
# Toutes les valeurs sont modifiables ; le pipeline les relit à chaque exécution.

territoire:
  nom: "Montpellier Méditerranée Métropole"
  # EPCI couverts (code SIREN). 243400017 = Montpellier Méditerranée Métropole (31 communes).
  epcis: ["243400017"]
  # Communes ajoutées hors EPCI (codes INSEE), par exemple pour la couronne.
  communes_supplementaires: []
  # Point de référence pour la distance au centre (Place de la Comédie).
  centre: { lon: 3.8800, lat: 43.6086 }

filtres:
  # Types de zone CNIG gardés : U (urbaine) et AUc (à urbaniser, ouverte).
  # AUs (à urbaniser bloquée) demande une modification du PLU : exclue.
  typezones_autorisees: ["U", "AUc"]
  # Mode « pari long terme » : zones prévues pour être urbanisées plus tard, encore bloquées.
  typezones_pari: ["AUs"]
  surface_min_m2: 500
  # Distance maximale à une voie carrossable (m).
  acces_route_max_m: 50
  # Les zones AUs sont souvent encore desservies par des chemins : tolérance plus large.
  acces_route_max_pari_m: 300
  # Part maximale de la parcelle couverte par du bâti.
  emprise_batie_max: 0.10
  # Prescriptions CNIG qui excluent une parcelle si elles en couvrent plus de la moitié :
  # 01 = espace boisé classé, 05 = emplacement réservé.
  prescriptions_exclues: ["01", "05"]
  recouvrement_prescription_max: 0.5
  # Zones à vocation résidentielle (FORMDOMI/DESTDOMI commençant par 01) : signalées,
  # exclues seulement si true.
  exclure_residentiel: false
  # Périmètres de PPR naturels (servitude PM1) : signalés, exclus seulement si true.
  # Les zones bleues d'un PPR restent souvent constructibles sous conditions.
  exclure_ppr: false

# Disponibilité : on écarte les terrains qui, selon les données publiques, ne sont
# probablement pas à vendre. Aucune source ouverte ne dit si un terrain est en vente.
disponibilite:
  # Vendue il y a moins de N mois (DVF) : l'acheteur a sans doute un projet.
  vendue_depuis_mois: 24
  # Permis de construire de locaux ou permis d'aménager sur la parcelle depuis N ans (Sitadel).
  permis_depuis_ans: 5
  # Groupes de propriétaires exclus (fichier DGFiP des personnes morales) :
  # 1 État, 2 Région, 3 Département, 4 Commune, 5 Office HLM, 9 Établissement public.
  # 6 (SEM, souvent aménageurs qui vendent des lots) et 0 (sociétés) restent.
  groupes_proprietaires_exclus: ["1", "2", "3", "4", "5", "9"]

agents:
  prix:
    rayon_m: 2000
    rayon_max_m: 5000
    ventes_min: 5
    annees: 3
    # Seules les ventes situées dans ces zones servent de comparaison (pas de terres agricoles).
    typezones_comparables: ["U", "AUc"]
    # Pour les parcelles en pari : ventes en zone AUs d'abord, sinon en zone agricole ou naturelle
    # (l'estimation est alors basse, signalée comme telle).
    typezones_comparables_pari: ["AUs"]
    typezones_comparables_pari_secours: ["AUs", "A", "N"]
  trafic:
    rayon_m: 300
    tmja_min: 500
    tmja_ref: 40000
    # Trafic estimé pour les routes sans comptage départemental (routes nationales).
    estimation_par_classe: { trunk: 25000, primary: 12000, secondary: 6000 }
    decote_estimation: 0.7
  accessibilite:
    echangeur_ideal_m: 2000
    echangeur_max_m: 15000
    centre_ideal_m: 5000
    centre_max_m: 40000
    part_echangeur: 0.6
    detour: 1.3
  surface:
    reference_m2: 50000
  dynamique:
    annees: 10
  developpement:
    rayon_m: 3000
    annees: 5
  rarete: {}
  front:
    # Surface nouvellement urbanisée à moins de N mètres, sur les 6 dernières années.
    rayon_m: 2000
  ouverture:
    # Une zone AUs collée à la ville a plus de chances d'être ouverte en premier.
    distance_ideale_m: 0
    distance_max_m: 800
    part_contiguite: 0.6

robustesse:
  tirages: 500
  # Plus la concentration est forte, plus les poids tirés restent proches des poids choisis.
  concentration: 40
  top_pct: 10

# Poids par défaut (profil « général »). Les autres profils se choisissent dans la carte.
poids:
  prix: 20
  trafic: 15
  accessibilite: 14
  surface: 13
  dynamique: 12
  developpement: 10
  rarete: 10
  ouverture: 0
  front: 6

profils:
  entrepot:
    nom: "Entrepôt, logistique"
    poids: { prix: 22, trafic: 15, accessibilite: 30, surface: 23, dynamique: 0, developpement: 5, rarete: 5 }
  bureaux:
    nom: "Bureaux"
    poids: { prix: 15, trafic: 5, accessibilite: 25, surface: 5, dynamique: 25, developpement: 15, rarete: 10 }
  commerce:
    nom: "Local commercial"
    poids: { prix: 15, trafic: 35, accessibilite: 10, surface: 10, dynamique: 20, developpement: 5, rarete: 5 }
  pari:
    nom: "Pari long terme (zones AUs)"
    mode: pari
    poids: { prix: 25, trafic: 5, accessibilite: 10, surface: 5, dynamique: 10, developpement: 5, rarete: 0, ouverture: 25, front: 15 }

# Pour garder la carte légère : on ne publie pas les parcelles dont l'estimation basse
# dépasse ce montant (celles sans estimation restent).
export:
  prix_max_publie: 400000

penalites:
  residentiel: 0.85
  ppr: 0.80

sources:
  geo_api: "https://geo.api.gouv.fr"
  cadastre: "https://cadastre.data.gouv.fr/data/etalab-cadastre/latest/geojson/communes/{dep}/{insee}/cadastre-{insee}-{couche}.json.gz"
  apicarto_gpu: "https://apicarto.ign.fr/api/gpu"
  datagouv_api: "https://www.data.gouv.fr/api/1"
  dvf_dataset: "demandes-de-valeurs-foncieres-geolocalisees"
  dvf_secours: "https://www.data.gouv.fr/api/1/datasets/r/d7933994-2c66-4131-a4da-cf7cd18040a4"
  trafic_comptages: "https://www.data.gouv.fr/api/1/datasets/r/a73022a0-6306-47c7-bbbd-05b1ebc18429"
  trafic_sections: "https://www.data.gouv.fr/api/1/datasets/r/dee210d1-131a-4d36-b1e3-7b540c72e181"
  overpass: "https://overpass-api.de/api/interpreter"
  insee_population: "https://www.insee.fr/fr/statistiques/3698339"
  sitadel_dataset: "689c42fa521ccf80ce954f83"
  # Fichier « autorisations d'urbanisme créant des locaux non résidentiels » (SDES, plateforme DiDo).
  sitadel_locaux_csv: "https://data.statistiques.developpement-durable.gouv.fr/dido/api/v1/datafiles/f8f0700f-806c-40a7-83b1-f21cf507e7c4/csv"
  sitadel_amenager_csv: "https://data.statistiques.developpement-durable.gouv.fr/dido/api/v1/datafiles/96883f50-538b-41f9-a059-c6eb97e6a23a/csv"
  # Consommation d'espaces naturels 2011-2025 par commune (Cerema), en m².
  consoenaf: "https://www.data.gouv.fr/api/1/datasets/r/b258feec-f8ff-4e0a-93b3-baf1fe46ef66"
  # Même donnée par carreau de 1 km (GeoPackage national, environ 95 Mo).
  consoenaf_grille: "https://www.data.gouv.fr/api/1/datasets/r/b11c843e-d73f-45e5-88b1-dcb5e9fc6e3b"
  # Propriétaires personnes morales (DGFiP), portail data.economie.gouv.fr.
  personnes_morales: "https://data.economie.gouv.fr/api/datasets/1.0/fichiers-des-locaux-et-des-parcelles-des-personnes-morales"
  # Zonage de la publication précédente, pour repérer les parcelles devenues constructibles.
  publication_precedente: "https://alexioshomegas.github.io/scoring-foncier/data/zonage.json"
